name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: codehub_rag
          POSTGRES_USER: codehub
          POSTGRES_PASSWORD: ci-local-only
        options: >-
          --health-cmd "pg_isready -U codehub -d codehub_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize schema
        run: docker exec -i ${{ job.services.postgres.id }} psql -U codehub -d codehub_rag -v ON_ERROR_STOP=1 < db/001_initial.sql
      - name: Check vector storage and snapshot constraints
        run: docker exec -i ${{ job.services.postgres.id }} psql -U codehub -d codehub_rag -v ON_ERROR_STOP=1 < db/smoke.sql
