name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node --check web/public/app.js
      - run: node web/scripts/build.mjs
      - run: node --test web/tests/*.test.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/export_web_config.py --check
      - run: uv run pytest -q

  database:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: codehub_rag_test
      POSTGRES_USER: codehub
      POSTGRES_PASSWORD: ci-local-only
      POSTGRES_HOST: 127.0.0.1
      CODEHUB_TEST_DB: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: codehub_rag_test
          POSTGRES_USER: codehub
          POSTGRES_PASSWORD: ci-local-only
        options: >-
          --health-cmd "pg_isready -U codehub -d codehub_rag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run codehub-rag migrate
      - name: Check vector storage and snapshot constraints
        run: docker exec -i ${{ job.services.postgres.id }} psql -U codehub -d codehub_rag_test -v ON_ERROR_STOP=1 < db/smoke.sql
      - run: uv run pytest tests/test_database.py tests/test_cloud.py -q
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: uv run python tests/seed_cloud.py
      - run: node --test web/tests/cloud-database.test.mjs
        env:
          CLOUD_DATABASE_URL: postgresql://codehub:ci-local-only@127.0.0.1:5432/codehub_rag_test
