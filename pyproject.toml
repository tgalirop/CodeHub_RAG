[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codehub-rag"
version = "0.1.0"
description = "Evidence-first ingestion and hybrid RAG for Code.Hub's public website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "bm25s>=0.2,<1",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.27,<1",
  "openai>=2,<4",
  "pgvector>=0.3,<1",
  "protego>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
codehub-rag = "codehub_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel.force-include]
"db" = "codehub_rag/sql"
"web/public" = "codehub_rag/web"
