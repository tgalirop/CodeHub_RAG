[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codehub-rag"
version = "0.1.0"
description = "Evidence-first ingestion and hybrid RAG for Code.Hub's public website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7.1,<1",
  "httpx>=0.27,<1",
  "protego>=0.3,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
codehub-rag = "codehub_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
